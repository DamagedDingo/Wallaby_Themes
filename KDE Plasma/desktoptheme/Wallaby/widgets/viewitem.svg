<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="248" height="48" viewBox="0 0 248 48">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-ButtonFocus { color: #f6df62; }
    </style>
  </defs>

  <rect id="hint-apply-color-scheme" width="1" height="1" x="247" y="47" opacity="0"/>
  <rect id="hint-tile-center" width="1" height="1" x="246" y="47" opacity="0"/>

  <!-- Normal: transparent but complete, so items have no background until highlighted. -->
  <g fill="#000000" opacity="0.001">
    <rect id="normal-center" x="6" y="6" width="44" height="36"/>
    <rect id="normal-top" x="6" y="0" width="44" height="6"/>
    <rect id="normal-topright" x="50" y="0" width="6" height="6"/>
    <rect id="normal-right" x="50" y="6" width="6" height="36"/>
    <rect id="normal-bottomright" x="50" y="42" width="6" height="6"/>
    <rect id="normal-bottom" x="6" y="42" width="44" height="6"/>
    <rect id="normal-bottomleft" x="0" y="42" width="6" height="6"/>
    <rect id="normal-left" x="0" y="6" width="6" height="36"/>
    <rect id="normal-topleft" x="0" y="0" width="6" height="6"/>
  </g>

  <!-- Hover: solid Wallaby yellow rather than Breeze's translucent blue tint. -->
  <g class="ColorScheme-ButtonFocus" fill="currentColor">
    <rect id="hover-center" x="70" y="6" width="44" height="36"/>
    <rect id="hover-top" x="70" y="0" width="44" height="6"/>
    <path id="hover-topright" d="M114 0a6 6 0 0 1 6 6h-6z"/>
    <rect id="hover-right" x="114" y="6" width="6" height="36"/>
    <path id="hover-bottomright" d="M120 42a6 6 0 0 1-6 6v-6z"/>
    <rect id="hover-bottom" x="70" y="42" width="44" height="6"/>
    <path id="hover-bottomleft" d="M64 42h6v6a6 6 0 0 1-6-6z"/>
    <rect id="hover-left" x="64" y="6" width="6" height="36"/>
    <path id="hover-topleft" d="M70 0v6h-6a6 6 0 0 1 6-6z"/>
  </g>

  <!-- Selected: the same solid yellow as hover for consistent launcher states. -->
  <g class="ColorScheme-ButtonFocus" fill="currentColor">
    <rect id="selected-center" x="134" y="6" width="44" height="36"/>
    <rect id="selected-top" x="134" y="0" width="44" height="6"/>
    <path id="selected-topright" d="M178 0a6 6 0 0 1 6 6h-6z"/>
    <rect id="selected-right" x="178" y="6" width="6" height="36"/>
    <path id="selected-bottomright" d="M184 42a6 6 0 0 1-6 6v-6z"/>
    <rect id="selected-bottom" x="134" y="42" width="44" height="6"/>
    <path id="selected-bottomleft" d="M128 42h6v6a6 6 0 0 1-6-6z"/>
    <rect id="selected-left" x="128" y="6" width="6" height="36"/>
    <path id="selected-topleft" d="M134 0v6h-6a6 6 0 0 1 6-6z"/>
  </g>

  <!-- Selected and hovered: retained as a separate frame required by Plasma. -->
  <g class="ColorScheme-ButtonFocus" fill="currentColor">
    <rect id="selected+hover-center" x="198" y="6" width="44" height="36"/>
    <rect id="selected+hover-top" x="198" y="0" width="44" height="6"/>
    <path id="selected+hover-topright" d="M242 0a6 6 0 0 1 6 6h-6z"/>
    <rect id="selected+hover-right" x="242" y="6" width="6" height="36"/>
    <path id="selected+hover-bottomright" d="M248 42a6 6 0 0 1-6 6v-6z"/>
    <rect id="selected+hover-bottom" x="198" y="42" width="44" height="6"/>
    <path id="selected+hover-bottomleft" d="M192 42h6v6a6 6 0 0 1-6-6z"/>
    <rect id="selected+hover-left" x="192" y="6" width="6" height="36"/>
    <path id="selected+hover-topleft" d="M198 0v6h-6a6 6 0 0 1 6-6z"/>
  </g>
</svg>
